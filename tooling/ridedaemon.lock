# Rebuilt 2026-08-10: the phone now ANNOUNCES supportSyncCorrectTime in its
# CLIENT_INFO reply (PhoneConfig). The clock answers themselves already shipped
# - the 45-byte 0x10601 body and the dateTime field of the 0x10451 reply - but a
# Carbit dash treats the clock sync as a two-sided capability, so a phone that
# never announced it may simply never have been asked. That would explain why
# the 0x10600 ack has never been seen exercised on a real bike.
#
# Note that grepping
# the .so for "supportSyncCorrectTime" does NOT prove the new field is present -
# HUDConfig already carried the identical struct tag on the inbound side and Go
# deduplicates it. The evidence is the Go test suite passing on the exact tree
# this artifact was built from. Binding surface diffed against the previous AAR:
# identical.
source_note=phone-announces-supportsynccorrecttime
