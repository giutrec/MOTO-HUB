# Rebuilt 2026-08-18 from the SAME clean commit de02c4c as the previous build,
# with one change: -androidapi 34 -> 31, because CORE now installs on Android
# 12+ and the manifest merger refuses a library whose minSdk exceeds the app's.
# No Go source changed; binding surface diffed against the previous AAR:
# identical. The API-31 AAR is also valid on 14+ phones.

# Rebuilt 2026-08-10, second time that day, and the second build REVERSES the
# first. The morning build made the phone advertise supportSyncCorrectTime in
# CLIENT_INFO; the reference implementation shipped exactly that claim, then
# withdrew it hours later reporting that firmware which saw it applied the
# 0x10601 reply aggressively and drove Zontes and Voge clusters to 00:00 even
# when their clock was already right. We have testers on both brands, so the
# claim is gone again and a test now asserts it stays off the wire.
#
# The 0x10600 answer itself is unchanged in spirit but smarter in fact: it used
# to overwrite the 29-byte stamp with phone time every single occasion, which
# the same reports say still left some clusters at 00:00. It now echoes the
# dash's own stamp untouched when that stamp is a sane wall clock (year
# 2020-2099, exact format), and supplies phone time only when the dash sends
# epoch, zeroes or junk. Never empty - an empty ack is what pushed Morini and
# Voge to 1970 in the first place. The log line carries mode=echo|phone, which
# is the whole diagnosis for a wrong-clock report.
#
# source_dirty=false: uncommitted in the fork checkout, so source_commit names
# the parent, not the built tree. Verified in the artifact by grepping the .so
# for the new timestamp regex - present here, absent in the previous AAR.
# Binding surface diffed against the previous AAR: identical.
source_note=clock-ack-echoes-sane-bike-stamp-no-capability-claim
