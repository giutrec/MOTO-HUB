# Rebuilt 2026-08-06: the clock replies now carry the RIDER'S wall clock. Both
# 0x10450 QUERY_TIME and 0x10600 HU_TIME_SYNC were built from Go's time.Now(),
# whose location on Android is UTC, so a Voge dash on 1.1.45 was told
# "05.08.2026 18:06:56" at 20:06:56 local and a currentTime with no offset in
# it - the clock was set, and set two hours wrong. Android now also supplies
# the UTC offset (MobileConfig.TimeZoneOffsetSeconds) and PXCControl.hostNow()
# presents every clock answer in it. Binding surface diffed against the
# previous AAR: identical apart from the new setter.
source_note=clock-ack-uses-host-timezone-offset
