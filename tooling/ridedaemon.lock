# Rebuilt 2026-08-18: the 0x10600 echo rule is now permissive. It used to hand
# the dash its own timestamp back only when that stamp matched an exact 29-char
# layout - anchored, space separator, precisely nine fractional digits - and
# rewrote everything else with phone time. Firmware that formats the field even
# slightly differently had a perfectly good clock overwritten; the reference
# implementation measured that as clusters landing HOURS out on Voge, QJ,
# X-Cape and Griffin, and dropped the strict check in their 2.0.10.
#
# Now: echo unless the dash sent nothing, sent epoch, or filled the field with
# something that is not printable text of at least a date's length. That last
# guard is ours and theirs lacks it - without it a short request carrying two
# raw bytes echoes back as an all-but-empty body, which is the exact shape that
# put Morini and Voge at 1970 to begin with. The old 18-byte regression test
# still passes because of it.
#
# Built with -androidapi 31 to match this worktree's minSdk. CORE is minSdk 31
# since "Run on Android 12 and 13"; pro-poc and the experiment worktree are
# still 34, so they keep the 34 build. An AAR must never require a higher API
# than the app's minSdk.
#
# Verified in the artifact by grepping the .so for the relaxed year pattern -
# present here, absent in the previous AAR. Binding surface diffed against the
# previous AAR: identical.
source_note=clock-ack-echoes-any-plausible-dash-stamp
