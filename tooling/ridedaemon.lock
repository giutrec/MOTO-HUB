# Rebuilt 2026-08-26: a teardown no longer reports itself as a dash failure, and
# the notice a surviving PXC channel produces now says which channel died and
# how long the dash had been ignoring it.
#
# The media control and media stream listeners gained the isStopping() guard the
# PXC server has always had - without it every stop emitted a fatal "use of
# closed network connection", which is net.ErrClosed, i.e. our own CloseAll
# reported back as the dash's fault. In a field log from a Voge dash over
# Wi-Fi Direct it was the FIRST line of the teardown, ahead of the dash-side EOF
# that actually caused it, because each callback is relayed on its own
# goroutine. Both listeners also took the per-connection fatality rule already
# used for PXC: fatal only when nothing else is being served there.
#
# Deliberately unchanged: the proactive keepalive. The ~18-minute ETIMEDOUT on
# an abandoned CAR_DATA is tcp_retries2 counting from the first unacknowledged
# byte, sent at the start of the session, so stopping the writes later cannot
# save that socket - only never writing to it would, and that trades a known
# 7-second death for a suspected one on a single correlation.
#
# Built with -androidapi 31, and pro-poc now records 31 too. It used to say 34,
# but both worktrees have been carrying the same API-31 artifact since 1.1.95;
# the field was describing an intention rather than the file. 31 is safe in both
# (CORE is minSdk 31, pro-poc 34) because an AAR must never require a HIGHER API
# than the app's minSdk - lower always works.
#
# Verified in the artifact: 4 ABIs as before, binding surface unchanged, the new
# format strings present in libgojni.so, and the same .so byte-for-byte inside
# app-debug.apk and app-core-debug.apk. app-pro-debug.apk carries zero copies of
# it, so the GPL boundary still holds.
source_note=teardown-is-not-a-dash-failure
